name = "moorestech-playtest-receiver"
main = "src/index.ts"
# テストのworkerdが解釈できる最新日付。これより先を書くとテストと本番で意味論がずれる
# The newest date the test workerd understands; a later date would split test and production semantics
compatibility_date = "2026-08-22"

# プレイテスト受け口の固定ドメイン。DNSはmoorestechのCloudflareアカウントのmoores.techゾーンに属する
# Fixed domain for the playtest receiver; DNS lives in the moores.tech zone of the moorestech Cloudflare account
routes = [{ pattern = "playtest.moores.tech", custom_domain = true }]

[vars]
STEAM_APP_ID = "1958160"
# 署名付きURLのホスト（<account>.r2.cloudflarestorage.com）と、URLへ埋めるバケット名。バケットのbindingとは別に文字列で要る
# Host of the presigned URL (<account>.r2.cloudflarestorage.com) and the bucket name embedded in it; needed as strings apart from the binding
R2_ACCOUNT_ID = "a60ba10bddf2fc760d75cc378137e8d4"
R2_BUCKET_NAME = "moorestech-playtest"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "moorestech-playtest"
