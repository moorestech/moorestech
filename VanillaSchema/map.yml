# NOTE このyamlに記述されているスキーマのコード、JSONローダーはSourceGeneratorによって自動生成されます。そのため、このスキーマのクラスやローダーを実装する必要はありません。
# NOTE The schema code and JSON loader described in this YAML are automatically generated by the SourceGenerator. Therefore, you do not need to implement the classes or loaders for this schema.

id: map
type: object
isDefaultOpen: true
# 採掘できるmapObjectだけが持つ設定。装飾物(None)はこの束ごと持たないため不正状態を構造上つくれない
# Settings only a minable map object carries; a decoration (None) lacks the whole set, so the invalid state cannot be expressed
defineInterface:
- interfaceName: IMinableMapObjectParam
  properties:
  - key: hp
    type: integer
    default: 100
  - key: earnItemHpInterval
    type: integer
    default: 10
  - key: soundEffectType
    type: enum
    options:
    - tree
    - stone
  - key: earnItems
    ref: mapObjectEarnItems
properties:
- key: mapObjects
  type: array
  openedByDefault: true
  overrideCodeGeneratePropertyName: MapObjectMasterElement
  items:
    type: object
    properties:
    - key: mapObjectGuid
      type: uuid
      autoGenerated: true
    - key: mapObjectName
      type: string
      default: mapObjectName
    - key: addressablePath
      type: string
      default: Vanilla/Environment/
    - key: miningType
      type: enum
      options:
      - PickUp
      - Mining
      - None
    - key: miningParam
      switch: ./miningType
      cases:
      - when: PickUp
        type: object
        implementationInterface:
        - IMinableMapObjectParam
        properties:
        - key: hp
          type: integer
          default: 100
        - key: earnItemHpInterval
          type: integer
          default: 10
        - key: soundEffectType
          type: enum
          options:
          - tree
          - stone
        - key: earnItems
          ref: mapObjectEarnItems
      # 装飾物。狙えず落とさず、採掘専用の設定を構造上持てない
      # Decoration: never aimed at, drops nothing, and structurally cannot carry mining settings
      - when: None
        type: object
        optional: true
        properties: []
      - when: Mining
        type: object
        implementationInterface:
        - IMinableMapObjectParam
        properties:
        - key: hp
          type: integer
          default: 100
        - key: earnItemHpInterval
          type: integer
          default: 10
        - key: soundEffectType
          type: enum
          options:
          - tree
          - stone
        - key: earnItems
          ref: mapObjectEarnItems
        - key: miningTools
          type: array
          items:
            type: object
            properties:
            - key: toolItemGuid
              type: uuid
              foreignKey:
                schemaId: items
                foreignKeyIdPath: /data/[*]/itemGuid
                displayElementPath: /data/[*]/name
            - key: damage
              type: integer
              default: 10
            - key: attackSpeed
              type: number
              default: 1
    - key: distanceVisibilityType
      type: enum
      default: cullable
      options:
      - cullable
      - landmark
- key: mapVeins
  type: array
  overrideCodeGeneratePropertyName: MapVeinMasterElement
  items:
    type: object
    properties:
    - key: veinGuid
      type: uuid
      autoGenerated: true
    - key: veinName
      type: string
      default: veinName
    - key: veinType
      type: enum
      options:
      - item
      - fluid
    - key: veinParam
      switch: ./veinType
      cases:
      - when: item
        type: object
        properties:
        - key: itemGuid
          type: uuid
          foreignKey:
            schemaId: items
            foreignKeyIdPath: /data/[*]/itemGuid
            displayElementPath: /data/[*]/name
      - when: fluid
        type: object
        properties:
        - key: fluidGuid
          type: uuid
          foreignKey:
            schemaId: fluids
            foreignKeyIdPath: /data/[*]/fluidGuid
            displayElementPath: /data/[*]/name
    - key: outcropAddressablePath
      type: string
      default: ""
    - key: soundEffectType
      type: enum
      options:
      - tree
      - stone
    - key: terrainSurroundEffectType
      type: enum
      options:
      - rockBareGround
      - rockNoBareGround
      # 鉱脈の配置点が地形へ与える効き方。岩と同じ2値で、裸地を塗るか距離場だけに乗せるかを選ぶ
      # How a vein's placement affects the terrain: the same two rock values, choosing bare-ground painting or the distance field alone
    - key: handMiningType
      type: enum
      options:
      - none
      - minable
    - key: handMiningParam
      switch: ./handMiningType
      cases:
      - when: none
        type: object
        optional: true
        properties: []
      - when: minable
        type: object
        properties:
        - key: handMiningTools
          type: array
          items:
            type: object
            properties:
            - key: toolItemGuid
              type: uuid
              foreignKey:
                schemaId: items
                foreignKeyIdPath: /data/[*]/itemGuid
                displayElementPath: /data/[*]/name
            - key: attackSpeed
              type: number
              default: 1
        - key: minCount
          type: integer
          default: 1
        - key: maxCount
          type: integer
          default: 1
