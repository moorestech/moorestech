# NOTE このyamlに記述されているスキーマのコード、JSONローダーはSourceGeneratorによって自動生成されます。そのため、このスキーマのクラスやローダーを実装する必要はありません。
# NOTE The schema code and JSON loader described in this YAML are automatically generated by the SourceGenerator. Therefore, you do not need to implement the classes or loaders for this schema.

id: map
type: object
isDefaultOpen: true
properties:
- key: mapObjects
  type: array
  openedByDefault: true
  overrideCodeGeneratePropertyName: MapObjectMasterElement
  items:
    type: object
    properties:
    - key: mapObjectGuid
      type: uuid
      autoGenerated: true
    - key: mapObjectName
      type: string
      default: mapObjectName
    - key: addressablePath
      type: string
      default: Vanilla/Environment/
    - key: hp
      type: integer
      default: 100
    - key: earnItemHpInterval
      type: integer
      default: 10
    - key: soundEffectType
      type: enum
      options:
      - tree
      - stone
    # このMapObjectが周囲の地形へ及ぼす見た目の効果。treeRootPatchは根元へ土の斑を塗り木用半径で草を間引き、
    # rockBareGroundは周囲を裸地へ塗り替えオブジェクト用半径で草を間引く。rockNoBareGroundは裸地を塗らずオブジェクト用半径で草だけ間引く
    # （移植元MapMakingはBoulder/Cliff名の岩だけ裸地化するため、瓦礫・メサ・小岩はこちら）。効果音の分類(soundEffectType)とは別軸
    # The visual effect this MapObject has on the terrain around it: treeRootPatch paints a soil patch at the base and thins
    # grass at the tree radius, rockBareGround repaints the surroundings as bare ground and thins grass at the object radius, and
    # rockNoBareGround only thins grass at the object radius without bare ground (the source MapMaking repaints only Boulder/Cliff
    # rocks, so rubble, mesas and small rocks go here). A separate axis from the sound classification (soundEffectType)
    - key: terrainSurroundEffectType
      type: enum
      options:
      - treeRootPatch
      - rockBareGround
      - rockNoBareGround
    - key: earnItems
      type: array
      items:
        type: object
        properties:
        - key: itemGuid
          type: uuid
          foreignKey:
            schemaId: items
            foreignKeyIdPath: /data/[*]/itemGuid
            displayElementPath: /data/[*]/name
        - key: minCount
          type: integer
          default: 1
        - key: maxCount
          type: integer
          default: 3
    - key: miningType
      type: enum
      options:
      - PickUp
      - Mining
    - key: miningParam
      switch: ./miningType
      cases:
      - when: PickUp
        type: object
        optional: true
        properties: []
      - when: Mining
        type: object
        properties:
        - key: miningTools
          type: array
          items:
            type: object
            properties:
            - key: toolItemGuid
              type: uuid
              foreignKey:
                schemaId: items
                foreignKeyIdPath: /data/[*]/itemGuid
                displayElementPath: /data/[*]/name
            - key: damage
              type: integer
              default: 10
            - key: attackSpeed
              type: number
              default: 1
- key: mapVeins
  type: array
  overrideCodeGeneratePropertyName: MapVeinMasterElement
  items:
    type: object
    properties:
    - key: veinGuid
      type: uuid
      autoGenerated: true
    - key: veinName
      type: string
      default: veinName
    - key: veinType
      type: enum
      options:
      - item
      - fluid
    - key: veinParam
      switch: ./veinType
      cases:
      - when: item
        type: object
        properties:
        - key: itemGuid
          type: uuid
          foreignKey:
            schemaId: items
            foreignKeyIdPath: /data/[*]/itemGuid
            displayElementPath: /data/[*]/name
      - when: fluid
        type: object
        properties:
        - key: fluidGuid
          type: uuid
          foreignKey:
            schemaId: fluids
            foreignKeyIdPath: /data/[*]/fluidGuid
            displayElementPath: /data/[*]/name
    - key: outcropAddressablePath
      type: string
      default: ""
    - key: soundEffectType
      type: enum
      options:
      - tree
      - stone
    - key: handMiningType
      type: enum
      options:
      - none
      - minable
    - key: handMiningParam
      switch: ./handMiningType
      cases:
      - when: none
        type: object
        optional: true
        properties: []
      - when: minable
        type: object
        properties:
        - key: handMiningTools
          type: array
          items:
            type: object
            properties:
            - key: toolItemGuid
              type: uuid
              foreignKey:
                schemaId: items
                foreignKeyIdPath: /data/[*]/itemGuid
                displayElementPath: /data/[*]/name
            - key: attackSpeed
              type: number
              default: 1
        - key: minCount
          type: integer
          default: 1
        - key: maxCount
          type: integer
          default: 1
