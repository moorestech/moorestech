# Clean-room (air purity) class thresholds with per-class yield values and chip-process role tables. data is expected to hold a single element.

id: cleanRoom
type: object
isDefaultOpen: true
properties:
- key: data
  type: array
  openedByDefault: true
  overrideCodeGeneratePropertyName: CleanRoomMasterElement
  items:
    type: object
    properties:
    - key: thresholds
      type: array
      items:
        type: object
        properties:
        - key: className
          type: string
        - key: requiredAirChangeRate
          type: number
        - key: qualityMultiplier
          type: number
        - key: layerFailRate
          type: number
        - key: dieLossRate
          type: number
    - key: layerExposures
      type: array
      items:
        type: object
        properties:
        - key: machineRecipeGuid
          type: uuid
          foreignKey:
            schemaId: machineRecipes
            foreignKeyIdPath: /data/[*]/machineRecipeGuid
            displayElementPath: /data/[*]/machineRecipeGuid
        - key: layeredWaferItemGuid
          type: uuid
          foreignKey:
            schemaId: items
            foreignKeyIdPath: /data/[*]/itemGuid
            displayElementPath: /data/[*]/name
        - key: failedWaferItemGuid
          type: uuid
          foreignKey:
            schemaId: items
            foreignKeyIdPath: /data/[*]/itemGuid
            displayElementPath: /data/[*]/name
        - key: maxFailReduction
          type: number
    - key: dicings
      type: array
      items:
        type: object
        properties:
        - key: machineRecipeGuid
          type: uuid
          foreignKey:
            schemaId: machineRecipes
            foreignKeyIdPath: /data/[*]/machineRecipeGuid
            displayElementPath: /data/[*]/machineRecipeGuid
        - key: dieItemGuid
          type: uuid
          foreignKey:
            schemaId: items
            foreignKeyIdPath: /data/[*]/itemGuid
            displayElementPath: /data/[*]/name
        - key: failedDieItemGuid
          type: uuid
          foreignKey:
            schemaId: items
            foreignKeyIdPath: /data/[*]/itemGuid
            displayElementPath: /data/[*]/name
        - key: diesPerWafer
          type: integer
        - key: maxLossReduction
          type: number
        # 品質モジュール最高Tierでレア枠へ移せる割合の上限
        # Cap on the share the quality sum can move into the rare slot
        - key: maxRareShift
          type: number
        # 品質最高Tier 0〜最大レベルの順に並ぶダイ表。Tier t は Lv t が既定・Lv t+1 がレア・それ未満と失敗ダイが失敗枠
        # Die tables ordered by highest quality tier 0..max level; tier t has Lv t default, Lv t+1 rare, lower levels and the failed die as the failure slot
        - key: qualityTierDieTables
          type: array
          items:
            type: object
            properties:
            - key: levelRates
              type: array
              items:
                type: number
            - key: failedRate
              type: number
