id: train
type: object
isDefaultOpen: true
properties:
- key: trainCars
  type: array
  openedByDefault: true
  overrideCodeGeneratePropertyName: TrainCarMasterElement
  items:
    type: object
    properties:
    - key: trainCarGuid
      type: uuid
      autoGenerated: true
    - key: requiredItems
      type: array
      optional: true
      overrideCodeGeneratePropertyName: TrainCarRequiredItemElement
      items:
        type: object
        properties:
        - key: itemGuid
          type: uuid
          foreignKey:
            schemaId: items
            foreignKeyIdPath: /data/[*]/itemGuid
            displayElementPath: /data/[*]/name
        - key: count
          type: integer
          default: 1
    - key: initialUnlocked
      type: boolean
      optional: true
      default: false
    - key: addressablePath
      type: string
      optional: true
      default: ""
    - key: weight
      type: integer
    - key: tractionForce
      type: integer
    # 重量の影響度。1で物理式どおり、0で重量が加速に効かない。編成では牽引力で重み付けした平均を使う（牽引力0の車両は効かない）
    # Weight influence exponent. 1 is plain physics, 0 ignores weight. A train uses the traction-weighted average (zero-traction cars have no effect)
    - key: weightInfluenceExponent
      type: number
      default: 1
    - key: inventorySlots
      type: integer
      default: 1
    - key: length
      type: integer
    - key: defaultContainerType
      type: enum
      options:
      - None
      - Item
      - Fluid
      default: None
    - key: fluidCapacity
      type: number
      default: 0
    - key: trainFuelItems
      type: array
      optional: true
      items:
        type: object
        properties:
        - key: itemGuid
          type: uuid
          foreignKey:
            schemaId: items
            foreignKeyIdPath: /data/[*]/itemGuid
            displayElementPath: /data/[*]/name
        - key: fuelDurationPerItem
          type: number
          default: 1
    - key: trainFuelFluids
      type: array
      optional: true
      items:
        type: object
        properties:
        - key: fluidGuid
          type: uuid
          foreignKey:
            schemaId: fluids
            foreignKeyIdPath: /data/[*]/fluidGuid
            displayElementPath: /data/[*]/name
        - key: fuelDurationPerUnitVolume
          type: number
          default: 1
    - key: ridableSeatCount
      type: integer
      default: 0
    - key: name
      type: string
- key: itemContainer
  type: object
  properties:
  - key: weight
    type: integer
    default: 40
- key: fluidContainer
  type: object
  properties:
  - key: weight
    type: integer
    default: 40
- key: motionParameters
  type: object
  properties:
  # Divided by 10000000
  - key: friction
    type: integer
    default: 35300
  # Divided by 10000000
  - key: airResistance
    type: integer
    default: 117
  # Unit: km/h/s. Converted to m/s^2 in TrainUnitMaster.
  - key: maxBrakeDecelerationKmhPerSecond
    type: number
    default: 11
  - key: masconLevelMaximum
    type: integer
    default: 16777216
  # 実効重量 = referenceWeight * (編成重量 / referenceWeight) ^ 影響度。この重さの編成は影響度に関わらず加速が変わらない
  # effectiveWeight = referenceWeight * (totalWeight / referenceWeight) ^ exponent. A train of exactly this weight is unaffected by the exponent
  - key: referenceWeight
    type: integer
    default: 120000
