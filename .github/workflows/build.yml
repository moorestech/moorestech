name: Unity Build

on:
  # 「ビルド検証」ラベルを付けたPRだけビルドする（全PRでは回さない。ADR 0028）
  # Only build PRs that carry the "ビルド検証" label; do not run on every PR (ADR 0028)
  pull_request:
    types: [labeled]

  # 日次フルビルド。UTC 19:00 = JST 翌04:00
  # Daily full build. 19:00 UTC equals 04:00 JST the next day
  schedule:
    - cron: '0 19 * * *'

  # 手動実行デバッグ用
  workflow_dispatch: {}

# 「ビルド検証」ラベルの再付与時のみ同一PRの古い実行をキャンセルする（groupはworkflow×ref単位）。
# 無関係なラベル付与はjob if で全skipの空runになるため、cancel対象から外す。
# Cancel outdated runs only when the "ビルド検証" label is re-applied to the same PR (group is per workflow and ref).
# Unrelated label events produce an all-skip empty run via job if, so exclude them from cancellation.
# 手動実行(workflow_dispatch)と日次(schedule)は条件が偽になるため実行中にキャンセルされない
# The condition is false for workflow_dispatch and schedule, so neither is cancelled mid-run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.label.name == 'ビルド検証' }}

jobs:
  # ===== サーバービルド =====
  # game-ci/unity-builder はmacOSでネイティブ実行のため、
  # 同一ジョブ内で2回呼ぶとライセンス認証が競合する。
  # そのためサーバーとクライアントを別ジョブに分割している。
  server-build:
    name: Server Build - ${{ matrix.platform.name }}
    # ラベル発火のときは「ビルド検証」ラベルのみ通す。日次・手動は無条件で通す
    # On label events only "ビルド検証" passes; scheduled and manual runs always proceed
    if: github.event_name != 'pull_request' || github.event.label.name == 'ビルド検証'
    runs-on: ${{ matrix.platform.runner }}

    # macOSのunity-builderはネイティブ実行のため、Server/Clientが同時にアクティベーションするとライセンス認証が落ちる
    # (コミット55b9aa971の再発。裁定2026-08-22でmacOSだけ直列化し、Windowsは並列のまま残す)
    # unity-builder runs natively on macOS, so a simultaneous Server/Client activation fails license validation
    # (a regression of commit 55b9aa971; adjudicated 2026-08-22 to serialize macOS only, leaving Windows parallel)
    # github.job はjob-level concurrencyでは空になるためジョブ種別をリテラルで書き分ける
    # github.job resolves to empty in a job-level concurrency block, so the job kind is written out literally
    concurrency:
      group: ${{ startsWith(matrix.platform.runner, 'macos') && format('unity-license-mac-{0}', github.run_id) || format('unity-license-server-{0}-{1}', matrix.platform.name, github.run_id) }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        platform:
          # ==========================================
          # プラットフォームの追加/削除でビルド対象を切り替え可能
          # Linux ビルドは一時的に無効化
          # ==========================================
          - name: StandaloneWindows64
            buildMethod: BuildPipeline.WindowsBuildFromGithubAction
            runner: windows-latest
            isDedicatedServer: false
          - name: StandaloneOSX
            buildMethod: BuildPipeline.MacOsBuildFromGithubAction
            runner: macos-latest
            isDedicatedServer: false
          # - name: StandaloneLinux64
          #   buildMethod: BuildPipeline.LinuxDedicatedServerFromGithubAction
          #   runner: ubuntu-latest
          #   isDedicatedServer: true

    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.longpaths true

      # WindowsのUnity Builderはコンテナで動くため、デーモンの起動を待つ
      # Unity Builder runs in a container on Windows, so wait for the daemon startup
      - name: Wait for Docker daemon (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $deadline = 30
          for ($i = 0; $i -lt $deadline; $i++) {
            docker info 2>&1 | Out-Null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "docker daemon ready after $($i * 10) seconds"
              exit 0
            }
            Start-Sleep -Seconds 10
          }
          Write-Error "docker daemon did not become ready within $($deadline * 10) seconds"
          exit 1

      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Update submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      # アーティファクト名を設定（GUI版とDedicated Serverで区別）
      - name: Set artifact name
        id: artifact
        shell: bash
        run: |
          if [ "${{ matrix.platform.isDedicatedServer }}" = "true" ]; then
            echo "name=Server_Output_DedicatedServer_${{ matrix.platform.name }}" >> $GITHUB_OUTPUT
            echo "path=moorestech_server/Output_DedicatedServer_${{ matrix.platform.name }}" >> $GITHUB_OUTPUT
          else
            echo "name=Server_Output_${{ matrix.platform.name }}" >> $GITHUB_OUTPUT
            echo "path=moorestech_server/Output_${{ matrix.platform.name }}" >> $GITHUB_OUTPUT
          fi

      # 日次ビルドはキャッシュ枠(10GB)をPR側へ譲るためコールドで回す（ADR 0028）
      # The daily build runs cold so the 10GB cache budget goes to PR-side jobs (ADR 0028)
      # Build
      - name: Server Build - ${{ matrix.platform.name }}
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.8f1
          buildMethod: ${{ matrix.platform.buildMethod }}
          targetPlatform: ${{ matrix.platform.name }}
          allowDirtyBuild: true
          projectPath: moorestech_server/

      # Upload Build (Windows, Mac)
      - name: Upload Server Build
        if: matrix.platform.name != 'StandaloneLinux64'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.path }}

      # Archive for Linux
      - name: Archive Server Build for Linux
        if: matrix.platform.name == 'StandaloneLinux64'
        run: |
          tar -czvf server_output.tar.gz ${{ steps.artifact.outputs.path }}

      - name: Upload Server Build for Linux
        if: matrix.platform.name == 'StandaloneLinux64'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ./server_output.tar.gz

  # ===== クライアントビルド =====
  # サーバービルドのartifactは消費しないため依存は無い。4ジョブを並列に走らせる（ADR 0028）
  # The client does not consume the server's artifacts, so there is no dependency; all four jobs run in parallel (ADR 0028)
  client-build:
    name: Client Build - ${{ matrix.platform.name }}
    # ラベル発火のときは「ビルド検証」ラベルのみ通す。日次・手動は無条件で通す
    # On label events only "ビルド検証" passes; scheduled and manual runs always proceed
    if: github.event_name != 'pull_request' || github.event.label.name == 'ビルド検証'
    runs-on: ${{ matrix.platform.runner }}

    # macOSのunity-builderはネイティブ実行のため、Server/Clientが同時にアクティベーションするとライセンス認証が落ちる
    # (コミット55b9aa971の再発。裁定2026-08-22でmacOSだけ直列化し、Windowsは並列のまま残す)
    # unity-builder runs natively on macOS, so a simultaneous Server/Client activation fails license validation
    # (a regression of commit 55b9aa971; adjudicated 2026-08-22 to serialize macOS only, leaving Windows parallel)
    # github.job はjob-level concurrencyでは空になるためジョブ種別をリテラルで書き分ける
    # github.job resolves to empty in a job-level concurrency block, so the job kind is written out literally
    concurrency:
      group: ${{ startsWith(matrix.platform.runner, 'macos') && format('unity-license-mac-{0}', github.run_id) || format('unity-license-client-{0}-{1}', matrix.platform.name, github.run_id) }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        platform:
          # ==========================================
          # プラットフォームの追加/削除でビルド対象を切り替え可能
          # LinuxクライアントはCEFネイティブランタイム不在で必ず失敗するため除外（.decisions/2026-08-02）
          # The Linux client is excluded because the CEF native runtime does not exist for it (.decisions/2026-08-02)
          # ==========================================
          - name: StandaloneWindows64
            buildMethod: Client.Editor.Build.BuildPipeline.WindowsBuildFromGithubAction
            runner: windows-latest
          - name: StandaloneOSX
            buildMethod: Client.Editor.Build.BuildPipeline.MacOsBuildFromGithubAction
            runner: macos-latest

    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.longpaths true

      # WindowsのUnity Builderはコンテナで動くため、デーモンの起動を待つ
      # Unity Builder runs in a container on Windows, so wait for the daemon startup
      - name: Wait for Docker daemon (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $deadline = 30
          for ($i = 0; $i -lt $deadline; $i++) {
            docker info 2>&1 | Out-Null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "docker daemon ready after $($i * 10) seconds"
              exit 0
            }
            Start-Sleep -Seconds 10
          }
          Write-Error "docker daemon did not become ready within $($deadline * 10) seconds"
          exit 1

      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Update submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      # Windows Docker コンテナ内では UPM の git clone + LFS が失敗するため、
      # ホスト上でパッケージを事前取得し、ローカルパスに差し替える
      - name: Pre-fetch CefUnity package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git clone --depth 1 --branch main https://github.com/KurisuJuha/cef-unity.git _cef_pkg
          cd _cef_pkg && git lfs pull && cd ..
          cp -r _cef_pkg/cef-unity-unityproject/Assets/CefUnity moorestech_client/CefUnityLocal
          cd moorestech_client/Packages
          python3 -c "
          import json
          with open('manifest.json', 'r') as f:
              data = json.load(f)
          data['dependencies']['jp.juha.cefunity'] = 'file:../CefUnityLocal'
          with open('manifest.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

      # Unityのビルド前処理(WebUiProductionArtifactBuilder)がpnpm buildを実行するが、
      # node/pnpm本体と webui/node_modules は gitignore されているためここで用意する
      - name: Setup Web UI toolchain
        shell: bash
        working-directory: moorestech_web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -File setup.ps1
            pnpm_binary="$PWD/node/win-x64/pnpm.exe"
          else
            bash setup.sh
            # setup.sh はランナーのarchに応じたディレクトリへ配置するのでglobで解決する
            # setup.sh installs into an arch-dependent directory, so resolve it by glob
            shopt -s nullglob
            candidates=(node/*/pnpm)
            pnpm_binary="$PWD/${candidates[0]}"
          fi
          if [ ! -f "$pnpm_binary" ]; then
            echo "pnpm not found after setup: $pnpm_binary" >&2
            exit 1
          fi
          "$pnpm_binary" --dir webui install --frozen-lockfile

      # 日次ビルドはキャッシュ枠(10GB)をPR側へ譲るためコールドで回す（ADR 0028）
      # The daily build runs cold so the 10GB cache budget goes to PR-side jobs (ADR 0028)
      # Build
      - name: Client Build - ${{ matrix.platform.name }}
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.8f1
          buildMethod: ${{ matrix.platform.buildMethod }}
          targetPlatform: ${{ matrix.platform.name }}
          allowDirtyBuild: true
          projectPath: moorestech_client/

      # Upload Build (Windows, Mac)
      - name: Upload Client Build
        if: matrix.platform.name != 'StandaloneLinux64'
        uses: actions/upload-artifact@v4
        with:
          name: Client_Output_${{ matrix.platform.name }}
          path: moorestech_client/Output_${{ matrix.platform.name }}

      # Archive for Linux
      - name: Archive Client Build for Linux
        if: matrix.platform.name == 'StandaloneLinux64'
        run: |
          tar -czvf client_output.tar.gz moorestech_client/Output_${{ matrix.platform.name }}

      - name: Upload Client Build for Linux
        if: matrix.platform.name == 'StandaloneLinux64'
        uses: actions/upload-artifact@v4
        with:
          name: Client_Output_${{ matrix.platform.name }}
          path: ./client_output.tar.gz
