name: Unity Test
on:
  pull_request:
    paths-ignore:
      - '**/*.md'

  # 手動実行デバッグ用
  workflow_dispatch: {}

# PR更新時に同一PRの古い実行をキャンセルする（groupはworkflow×ref単位。PRのrefはrefs/pull/N/mergeでPRごとに一意）。
# cancel-in-progressをPRイベント限定にしているため、手動実行(workflow_dispatch)が実行中にキャンセルされることはない。
# Cancel outdated runs of the same PR on update (the group is per workflow and ref; a PR's ref is unique per PR).
# cancel-in-progress only applies to PR events, so manual workflow_dispatch runs are never cancelled mid-run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Web UI の契約ガード(vitest・レジストリ型検査)をCIで強制する。ローカル実行任せだとdrift再発を検知できない
  # Enforce the Web UI contract guards (vitest, registry typecheck) in CI; local-only runs cannot catch drift regressions
  webui-test:
    name: Web UI Test (vitest + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # node/pnpm本体と webui/node_modules は gitignore されているため build.yml と同じ手順で用意する
      # node/pnpm and webui/node_modules are gitignored, so provision them the same way as build.yml
      - name: Setup Web UI toolchain and run checks
        shell: bash
        working-directory: moorestech_web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          bash setup.sh
          # setup.sh はランナーのarchに応じたディレクトリへ配置するのでglobで解決する
          # setup.sh installs into an arch-dependent directory, so resolve it by glob
          shopt -s nullglob
          candidates=(node/*/pnpm)
          pnpm_binary="$PWD/${candidates[0]}"
          if [ ! -f "$pnpm_binary" ]; then
            echo "pnpm not found after setup: $pnpm_binary" >&2
            exit 1
          fi
          "$pnpm_binary" --dir webui install --frozen-lockfile
          "$pnpm_binary" --dir webui exec tsc -b --force
          "$pnpm_binary" --dir webui exec tsc -p e2e/tsconfig.json --noEmit
          "$pnpm_binary" --dir webui exec vitest run

  test:
    name: EditMode Test (Client + Server)
    runs-on: ubuntu-latest
    steps:
      # 使用するGithub Tokenを動的に生成する
      # 利用は ${{ steps.generate_token.outputs.token }}
      - name: Generate github token
        id: generate_token
        uses: tibdex/github-app-token@v1
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.PRIVATE_KEY }}

      # リポジトリとサブモジュールをチェックアウト
      - name: Check out my unity project.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # GameCIコンテナ内ではUPMのGit LFS資産が取得されないため、
      # ホスト上でCefUnityを事前取得し、ローカルパッケージに差し替える
      # GameCI does not fetch UPM Git LFS assets in its container, so pre-fetch
      # CefUnity on the host and replace the dependency with a local package
      - name: Pre-fetch CefUnity package
        shell: bash
        env:
          CEF_UNITY_LINUX_REVISION: c641e59a4778d2743cb5559f2bc1c4417c9a0f4a
        run: |
          # packages-lockのrevisionにはLinux資産が無いため、Linux対応commitをSHA固定で使う
          # The packages-lock revision predates Linux assets, so pin the Linux-capable commit by SHA
          git init _cef_pkg
          git -C _cef_pkg remote add origin https://github.com/KurisuJuha/cef-unity.git
          git -C _cef_pkg fetch --depth 1 origin "$CEF_UNITY_LINUX_REVISION"
          git -C _cef_pkg checkout --detach FETCH_HEAD
          git -C _cef_pkg lfs pull
          cp -r _cef_pkg/cef-unity-unityproject/Assets/CefUnity moorestech_client/CefUnityLocal
          cd moorestech_client/Packages
          python3 -c "
          import json
          with open('manifest.json', 'r') as f:
              data = json.load(f)
          data['dependencies']['jp.juha.cefunity'] = 'file:../CefUnityLocal'
          with open('manifest.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

      # 起動テストがViteホストを開始するため、Node/pnpmと依存パッケージを同じジョブ内に用意する
      # Startup tests launch the Vite host, so provision Node/pnpm and dependencies in this job
      - name: Setup Web UI toolchain
        shell: bash
        working-directory: moorestech_web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          bash setup.sh
          # setup.shはランナーのarchに応じたディレクトリへ配置するのでglobで解決する
          # setup.sh installs into an arch-dependent directory, so resolve it by glob
          shopt -s nullglob
          candidates=(node/*/pnpm)
          pnpm_binary="$PWD/${candidates[0]}"
          if [ ! -f "$pnpm_binary" ]; then
            echo "pnpm not found after setup: $pnpm_binary" >&2
            exit 1
          fi
          "$pnpm_binary" --dir webui install --frozen-lockfile

      # 年月日を取得　キャッシュのkeyに利用
      - name: Set current datetime as env variable
        env:
          TZ: 'Asia/Tokyo'
        run: echo "CURRENT_DATETIME=$(date +'%Y-%m')" >> $GITHUB_ENV

      # キャッシュ keyを月跨ぎで更新することで定期的にキャッシュ自体の更新を行う
      - uses: actions/cache@v3
        with:
          path: moorestech_client/Library
          key: "Library_Test_${{ env.CURRENT_DATETIME }}"

      # GameCI の Test runner を利用して
      # EditMode のテストを実行する
      - name: Run Unity Test
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: moorestech_client/
          githubToken: ${{ steps.generate_token.outputs.token }}
          unityVersion: 6000.3.8f1
          testMode: editmode
          customParameters: '-testCategory "!IgnoreCI"'

      # テストの実行結果をアーティファクトにアップロードしてダウンロードして参照できるようにする
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test results
          path: artifacts
