name: Unity Test
on:
  pull_request:
    paths-ignore:
      - '**/*.md'

  # 手動実行デバッグ用
  workflow_dispatch: {}

# PR更新時に同一PRの古い実行をキャンセルする（groupはworkflow×ref単位。PRのrefはrefs/pull/N/mergeでPRごとに一意）。
# cancel-in-progressをPRイベント限定にしているため、手動実行(workflow_dispatch)が実行中にキャンセルされることはない。
# Cancel outdated runs of the same PR on update (the group is per workflow and ref; a PR's ref is unique per PR).
# cancel-in-progress only applies to PR events, so manual workflow_dispatch runs are never cancelled mid-run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GameCIのshard別check投稿にはジョブ寿命の標準tokenを使う。
# Use the job-scoped standard token for GameCI's per-shard check runs.
permissions:
  contents: read
  checks: write

jobs:
  # Web UI の契約ガード(vitest・レジストリ型検査)をCIで強制する。ローカル実行任せだとdrift再発を検知できない
  # Enforce the Web UI contract guards (vitest, registry typecheck) in CI; local-only runs cannot catch drift regressions
  webui-test:
    name: Web UI Test (vitest + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # node/pnpm本体と webui/node_modules は gitignore されているため build.yml と同じ手順で用意する
      # node/pnpm and webui/node_modules are gitignored, so provision them the same way as build.yml
      - name: Setup Web UI toolchain and run checks
        shell: bash
        working-directory: moorestech_web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          bash setup.sh
          # setup.sh はランナーのarchに応じたディレクトリへ配置するのでglobで解決する
          # setup.sh installs into an arch-dependent directory, so resolve it by glob
          shopt -s nullglob
          candidates=(node/*/pnpm)
          pnpm_binary="$PWD/${candidates[0]}"
          if [ ! -f "$pnpm_binary" ]; then
            echo "pnpm not found after setup: $pnpm_binary" >&2
            exit 1
          fi
          "$pnpm_binary" --dir webui install --frozen-lockfile
          "$pnpm_binary" --dir webui exec tsc -b --force
          "$pnpm_binary" --dir webui exec tsc -p e2e/tsconfig.json --noEmit
          "$pnpm_binary" --dir webui exec vitest run

  # 重量fixtureを実測時間で分割し、未列挙テストはClient/Serverの残余shardへ必ず流す。
  # Split heavy fixtures by measured duration and always route unlisted tests into a Client or Server remainder shard.
  unity_test_shard:
    name: Unity Test - ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - client-play-1
          - client-play-2
          - client-play-3
          - client-remainder
          - server-map-1
          - server-map-2
          - server-map-3
          - server-remainder
    steps:
      # HEADしか参照しないテストなので履歴を取得せず、8 shard共通のcheckout固定費を抑える。
      # Tests only inspect HEAD, so skip history to reduce checkout overhead paid by all eight shards.
      - name: Check out my unity project.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          path: moorestech

      # 実測で決めたfilterを一箇所から解決し、matrixと除外集合の乖離を防ぐ。
      # Resolve measured filters from one source so the matrix and exclusion sets cannot drift apart.
      - name: Resolve Unity test shard.
        id: shard
        shell: bash
        working-directory: moorestech
        run: bash .github/scripts/unity-test-shard-filter.sh "${{ matrix.shard }}"

      # pin先SHAを本体repoの追跡ファイルから取得する
      # Read the pinned SHA from the tracked file in the main repository
      - name: Read pinned master repository revision.
        id: master_revision
        shell: bash
        working-directory: moorestech
        run: |
          commit_hash=$(jq -er '.repositories[] | select(.key == "moorestech_master") | .commitHash' .moorestech-external-revisions.json)
          echo "commit_hash=$commit_hash" >> "$GITHUB_OUTPUT"

      # 非公開master repoのcheckoutだけにGitHub App tokenを限定する。
      # Limit the GitHub App token to checking out the private master repository.
      - name: Generate github token
        id: generate_token
        uses: tibdex/github-app-token@v1
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.PRIVATE_KEY }}

      # pin先の本番辞書を既存の相対パス契約どおり本体repoと横並びに配置する
      # Place the pinned production dictionary beside the main repo to preserve the existing relative-path contract
      - name: Check out pinned master repository.
        uses: actions/checkout@v4
        with:
          repository: moorestech/moorestech_master
          token: ${{ steps.generate_token.outputs.token }}
          ref: ${{ steps.master_revision.outputs.commit_hash }}
          path: moorestech_master

      # ClientテストだけがViteホストを開始するため、Server 4 shardではNode準備を省く。
      # Only Client tests launch the Vite host, so skip Node setup in the four Server shards.
      - name: Setup Web UI toolchain
        if: steps.shard.outputs.needs_webui == 'true'
        shell: bash
        working-directory: moorestech/moorestech_web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          bash setup.sh
          # setup.shはランナーのarchに応じたディレクトリへ配置するのでglobで解決する
          # setup.sh installs into an arch-dependent directory, so resolve it by glob
          shopt -s nullglob
          candidates=(node/*/pnpm)
          pnpm_binary="$PWD/${candidates[0]}"
          if [ ! -f "$pnpm_binary" ]; then
            echo "pnpm not found after setup: $pnpm_binary" >&2
            exit 1
          fi
          "$pnpm_binary" --dir webui install --frozen-lockfile

      # masterのcache-warmが焼いたキャッシュをrestore-keysの前方一致で拾う（ADR 0028）
      # Pick up whatever master's cache-warm produced via the restore-keys prefix (ADR 0028)
      # 保存はmasterのcache-warm.ymlだけが行う（PR側で焼くと10GB枠を食い潰すため。裁定 2026-08-22）
      # Only master's cache-warm.yml writes caches; saving from PRs would exhaust the 10GB budget (ruling 2026-08-22)
      # 接頭辞はcache-warm.yml(warm-client-test)と逐語一致が必須。片側だけ改名するとエラー無しで全PRがコールドへ戻る
      # The prefix must match cache-warm.yml (warm-client-test) verbatim; renaming one side silently sends every PR back to cold
      - uses: actions/cache/restore@v4
        with:
          path: moorestech/moorestech_client/Library
          key: Library_Test_client-${{ github.sha }}
          restore-keys: |
            Library_Test_client-

      # 専用shardだけassemblyを絞り、全assemblyを受ける残余shardで将来のtest assemblyも欠落させない。
      # Scope only dedicated shards by assembly; all-assembly remainder shards retain future test assemblies without gaps.
      - name: Run Unity Test - ${{ matrix.shard }}
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: moorestech/moorestech_client/
          githubToken: ${{ github.token }}
          checkName: Test Results - ${{ matrix.shard }}
          unityVersion: 6000.3.8f1
          testMode: editmode
          customParameters: >-
            ${{ steps.shard.outputs.assembly_names != '' && format('-assemblyNames "{0}"', steps.shard.outputs.assembly_names) || '' }}
            -testFilter "${{ steps.shard.outputs.test_filter }}"
            -testCategory "!IgnoreCI"

      # shard別artifact名で結果の上書きを防ぎ、全件同一性と所要時間を後から検証可能にする。
      # Use per-shard artifact names to prevent overwrites and preserve evidence for coverage and timing audits.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test results - ${{ matrix.shard }}
          path: artifacts

  # 既存のcheck表示名を維持し、全shard成功だけを単一のmerge判定へ畳む。
  # Preserve the existing check display name and fold all shard results into one merge verdict.
  test:
    name: EditMode Test (Client + Server)
    if: always()
    needs: unity_test_shard
    runs-on: ubuntu-latest
    steps:
      - name: Require every Unity test shard to pass.
        shell: bash
        env:
          SHARD_RESULT: ${{ needs.unity_test_shard.result }}
        run: |
          if [[ "$SHARD_RESULT" != 'success' ]]; then
            echo "Unity test shard result: $SHARD_RESULT" >&2
            exit 1
          fi
