name: UITK Web Follow Gate
on:
  # 台帳（.md）だけの PR でも走らせるため paths-ignore を付けない
  # No paths-ignore, so PRs touching only the ledger (.md) still run the gate
  pull_request: {}

# PR更新時に同一PRの古い実行をキャンセルする
# Cancel outdated runs of the same PR on update
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # UITK 移行の追従ゲート G1。暗転中の束に入った Web 変更の記帳と、切替済みの束の Web 変更を検査する
  # UITK migration follow gate G1: checks records for Web changes in dark bundles and rejects changes to switched bundles
  uitk-web-follow-gate:
    name: UITK Web follow gate (G1)
    # 長命ブランチ feature/uitk への PR と、そこから master への切替 PR だけで走る。master の作業者に記帳を求めない
    # Runs only on PRs into feature/uitk and the switch PR from it, so master contributors are never asked to record
    if: github.base_ref == 'feature/uitk' || github.head_ref == 'feature/uitk'
    runs-on: ubuntu-latest
    steps:
      # 既定の PR マージ参照を全履歴で取る。台帳より前に分岐した PR でも base 側の台帳で検査できる
      # Check out the default PR merge ref with full history, so PRs branched before the ledger still read it from base
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run G1 against this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/scripts/check-uitk-web-follow.py --base "$BASE_SHA" --head HEAD

      # 実ソース全件が台帳の行に入るかの検査。台帳に記入する側（feature/uitk）の PR だけで走らせる
      # Checks that every real Web source falls into a ledger row; runs only on the PRs where the ledger is maintained
      - name: Test the real ledger against the Web sources
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_uitk_web_follow_real_ledger.py' -v

  # G1 自身の単体テスト。if を付けず master の PR でも走らせ、スクリプトの破損を master で止める（合成の台帳だけを読み、実ソースと実台帳の突き合わせは含めない）
  # Unit tests of G1 itself. No if, so master PRs also run them and a broken script is caught on master (only synthetic ledgers are read; the real-source ledger check is excluded)
  uitk-web-follow-gate-selftest:
    name: UITK Web follow gate self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test the gate itself
        run: |
          set -e
          for test_file in .github/scripts/tests/test_uitk_web_follow_*.py; do
            name=$(basename "$test_file")
            [ "$name" = "test_uitk_web_follow_real_ledger.py" ] && continue
            python3 -m unittest discover -s .github/scripts/tests -p "$name" -v
          done
